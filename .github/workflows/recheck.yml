name: Re-check official sources

on:
  schedule:
    # Daily at 06:00 UTC (early morning Las Vegas local time).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Need push access to record the updated baseline.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-read every official source URL and diff against the baseline
        run: python3 scripts/recheck_sources.py

      - name: Morning schedule feed (is each captured row still on the official page?)
        run: python3 scripts/recheck_sources.py --feed

      - name: Commit and push the updated baseline if anything changed
        run: |
          if git diff --quiet data/c6087e2c/last_checked.json data/c6087e2c/schedule_feed.json; then
            echo "No official source changed; nothing to commit."
          else
            git config user.name "poker5-recheck[bot]"
            git config user.email "recheck@users.noreply.github.com"
            git add data/c6087e2c/last_checked.json data/c6087e2c/schedule_feed.json
            git commit -m "chore: re-check official sources and schedule feed [skip ci]"
            git push
          fi
