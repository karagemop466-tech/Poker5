name: Daily official-source scrape (root site)

# Every morning this job reads the official pages and PDFs behind the root
# planner and records exactly what they say (with the excerpt and the
# retrieval timestamp) into data/c6087e2c/. The agent sandbox that authors
# this repo cannot open a connection to casino hosts, so the reading happens
# here, on a runner with normal internet access.
#
# This job is capture-only: it never rebuilds the published root site. The
# root site has exactly one generator (scripts/build_ea99006a.py, run by the
# recheck-ea99006a workflow and validated by Quality checks), so the morning
# capture cannot silently overwrite pages with a different builder's output.
#
# A changed source never silently changes a displayed value: the scraper writes
# new excerpts and hashes, and any field that disappeared from a source becomes
# blank + flagged in the capture for review.

on:
  schedule:
    - cron: "37 13 * * *"   # 13:37 UTC daily (~06:37 Las Vegas)
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "scripts/scrape_251c122f.py"
      - "scripts/build_c6087e2c.py"
      - "scripts/check_root_site.py"
      - ".github/workflows/daily-scrape.yml"
      - "data/c6087e2c/verification_251c122f.json"

permissions:
  contents: write

concurrency:
  group: daily-scrape-root
  cancel-in-progress: false

jobs:
  scrape-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch this run belongs to
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python3 -m pip install --quiet pypdf==5.1.0

      - name: Parser self-test (no network)
        run: python3 scripts/scrape_251c122f.py --self-test

      - name: Read every official schedule row and structure sheet
        run: python3 scripts/scrape_251c122f.py

      - name: Merge the live capture into the verified dataset
        run: python3 scripts/merge_251c122f.py

      - name: Upload the capture for review (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_id }}
          path: |
            data/c6087e2c/schedule_live.json
            data/c6087e2c/structures.json
            data/c6087e2c/scrape_status.json
            data/c6087e2c/watch_status.json
            data/c6087e2c/events_verified.json
          if-no-files-found: warn

      - name: Commit the refreshed capture (scheduled and branch runs)
        run: |
          git config user.name  "poker5-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/c6087e2c/
          if git diff --cached --quiet; then
            echo "no change in the capture"
            exit 0
          fi
          git commit -m "scrape(251c122f): daily official-source capture $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            echo "rebase attempt $attempt failed; retrying"
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate the capture's rule fields and verdicts
        run: python3 scripts/crosscheck_251c122f.py

      - name: Print the capture summary
        if: always()
        run: python3 scripts/summary_251c122f.py
