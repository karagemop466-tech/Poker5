name: Daily official-source scrape (Venetian capture)

# Every morning this job reads the official pages and PDFs, records exactly what
# they say (with the excerpt and the retrieval timestamp) and pushes the capture.
# The agent sandbox that authors this repo cannot open a connection to casino
# hosts, so the reading happens here, on a runner with normal internet access.
#
# CHANGED 2026-11-19 by session bdcaf0bf: this job no longer rebuilds the
# published site. Two generators writing index.html/pages from different datasets
# made the live answers alternate between runs (flag B02); the root site is now
# generated only by scripts/build_bdcaf0bf.py, which reads this folder.
#
# A changed source never silently changes a displayed value: this job writes the
# new excerpts and hashes, and the canonical build that reads them turns any field
# that disappeared from a source into a blank plus a flag
# (scripts/integrate_bdcaf0bf.py -> scripts/build_bdcaf0bf.py).

on:
  schedule:
    - cron: "37 13 * * *"   # 13:37 UTC daily (~06:37 Las Vegas)
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "scripts/scrape_251c122f.py"
      - "scripts/build_c6087e2c.py"
      - "scripts/check_root_site.py"
      - ".github/workflows/daily-scrape.yml"
      - "data/c6087e2c/verification_251c122f.json"

permissions:
  contents: write

concurrency:
  group: daily-scrape-root
  cancel-in-progress: false

jobs:
  scrape-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch this run belongs to
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python3 -m pip install --quiet pypdf==5.1.0

      - name: Parser self-test (no network)
        run: python3 scripts/scrape_251c122f.py --self-test

      - name: Read every official schedule row and structure sheet
        run: python3 scripts/scrape_251c122f.py

      - name: Merge the live capture into the verified dataset
        run: python3 scripts/merge_251c122f.py

      # The site is built by .github/workflows/integrate-bdcaf0bf.yml, which merges
      # this capture with the other sessions' data before writing index.html and pages/.
      # scripts/build_c6087e2c.py is still available for the session's own folder output.

      - name: Upload the capture for review (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_id }}
          path: |
            data/c6087e2c/schedule_live.json
            data/c6087e2c/structures.json
            data/c6087e2c/scrape_status.json
            data/c6087e2c/watch_status.json
            data/c6087e2c/events_verified.json
          if-no-files-found: warn

      - name: Commit the refreshed capture (scheduled and branch runs)
        run: |
          git config user.name  "poker5-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/c6087e2c/
          if git diff --cached --quiet; then
            echo "no change in the capture or the site"
            exit 0
          fi
          git commit -m "scrape(251c122f): daily official-source capture $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            echo "rebase attempt $attempt failed; retrying"
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate links, source anchors and cross-checks
        run: |
          python3 scripts/crosscheck_251c122f.py

      - name: Print the capture summary
        if: always()
        run: python3 scripts/summary_251c122f.py
