name: Daily official-source capture (research ledger)

# The morning scraper reads the official schedules and structure PDFs into the
# c6087e2c research ledger and uploads a capture artifact. The canonical Pages
# site is rebuilt by recheck-ea99006a.yml from data/ea99006a. This capture job
# must not regenerate or commit index.html/pages/assets: doing so would publish
# a competing dataset and undo the canonical site's filters and layout.

on:
  schedule:
    - cron: "37 13 * * *"   # 13:37 UTC daily (~06:37 Las Vegas)
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "scripts/scrape_251c122f.py"
      - "scripts/merge_251c122f.py"
      - "scripts/check_root_site.py"
      - "scripts/check_ea99006a.py"
      - "scripts/crosscheck_251c122f.py"
      - "scripts/summary_251c122f.py"
      - ".github/workflows/daily-scrape.yml"
      - "data/c6087e2c/verification_251c122f.json"

permissions:
  contents: write

concurrency:
  group: daily-official-capture
  cancel-in-progress: false

jobs:
  scrape-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch this run belongs to
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python3 -m pip install --quiet pypdf==5.1.0

      - name: Parser self-test (no network)
        run: python3 scripts/scrape_251c122f.py --self-test

      - name: Read every official schedule row and structure sheet
        run: python3 scripts/scrape_251c122f.py

      - name: Merge the live capture into the verified research ledger
        run: python3 scripts/merge_251c122f.py

      - name: Upload the capture for review (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_id }}
          path: |
            data/c6087e2c/schedule_live.json
            data/c6087e2c/structures.json
            data/c6087e2c/scrape_status.json
            data/c6087e2c/watch_status.json
            data/c6087e2c/events_verified.json
          if-no-files-found: warn

      - name: Commit the refreshed research capture only
        run: |
          git config user.name  "poker5-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/c6087e2c/
          if git diff --cached --quiet; then
            echo "no change in the research capture"
            exit 0
          fi
          git commit -m "scrape(251c122f): daily official-source capture $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            echo "rebase attempt $attempt failed; retrying"
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Cross-check the source capture (verdicts, sheets, dates)
        run: python3 scripts/crosscheck_251c122f.py

      - name: Check canonical site links and source anchors
        run: python3 scripts/check_root_site.py

      - name: Print the capture summary
        if: always()
        run: python3 scripts/summary_251c122f.py
