name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and test the existing strict-entry dashboard
        run: npm run check
      - name: Check the isolated planner JavaScript
        run: node --check planner-aa83f1e1/assets/app.js
      - name: Smoke-render all isolated planner pages
        run: node scripts/smoke_aa83f1e1.mjs
      - name: Validate and build the isolated planner
        run: node scripts/build_aa83f1e1.mjs
      - name: Parser self-test for the official-source scraper (no network)
        run: python3 scripts/scrape_251c122f.py --self-test
      - name: Regenerate the root Pages site from the official capture
        run: python3 scripts/build_251c122f.py
      - name: Cross-check every verdict, source link and internal link
        run: python3 scripts/crosscheck_251c122f.py
