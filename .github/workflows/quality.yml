name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and test the existing strict-entry dashboard
        run: npm run check
      - name: Check the isolated planner JavaScript
        run: node --check planner-aa83f1e1/assets/app.js
      - name: Smoke-render all isolated planner pages
        run: node scripts/smoke_aa83f1e1.mjs
      - name: Validate and build the isolated planner
        run: node scripts/build_aa83f1e1.mjs
      - name: Regenerate and validate the existing root Pages site
        run: python3 scripts/build_c6087e2c.py
      - name: Check the root site (links, source anchors, baseline)
        run: python3 scripts/check_root_site.py
      - name: Verify the scheduled source re-check baseline
        run: python3 scripts/recheck_sources.py --offline
