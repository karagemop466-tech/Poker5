name: Quality checks

# One canonical root-site pipeline: scripts/build_ea99006a.py generates the
# GitHub Pages root site from data/ea99006a/, and scripts/check_ea99006a.py
# validates it (every table row links to an official source; every internal
# link resolves). CI regenerates the site and fails if the committed output
# drifted from the generator output. pages/repo-review.html is excluded from
# the drift check because it embeds a live inventory of the repository tree
# and changes whenever any file (including COORDINATION.md) changes size.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and test the existing strict-entry dashboard
        run: npm run check
      - name: Check the published site JavaScript
        run: node --check assets/app.js
      - name: Check the isolated planner JavaScript
        run: node --check planner-aa83f1e1/assets/app.js
      - name: Smoke-render all isolated planner pages
        run: node scripts/smoke_aa83f1e1.mjs
      - name: Validate and build the isolated planner
        run: node scripts/build_aa83f1e1.mjs
      - name: Parser self-test for the official-source scraper (no network)
        run: python3 scripts/scrape_251c122f.py --self-test
      - name: Route ledger matches the official addresses recorded in the data
        # data/ea99006a/routes.json is derived from hotels.json + venues.json by this generator;
        # if an address is corrected and the ledger is not regenerated, the published map links
        # would be pinned on a stale pair. --check fails on that drift instead of hiding it.
        run: python3 scripts/complete_routes_6dba9b3c.py --check
      - name: Regenerate the root Pages site from the official data (canonical builder)
        run: python3 scripts/build_ea99006a.py
      - name: Validate rows, source links and internal links
        run: |
          python3 scripts/check_ea99006a.py
          python3 scripts/check_root_site.py
      - name: Validate the source-monitor ledger offline
        run: python3 scripts/recheck_ea99006a.py --offline
      - name: Cross-check every capture verdict and rule field
        run: python3 scripts/crosscheck_251c122f.py
      - name: Committed site matches the generator output
        run: |
          if ! git diff --exit-code -- pages index.html assets ':(exclude)pages/repo-review.html'; then
            echo "::error::The committed root site differs from scripts/build_ea99006a.py output. Re-run the builder and commit the result."
            exit 1
          fi
