name: recheck-ea99006a

# Session ea99006a - re-fetch every official source that backs a table row,
# hash it, and record what changed. 13:00 UTC == 6:00 AM Las Vegas, so the
# change log is fresh before the day's tournaments start.

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck-ea99006a
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the source ledger offline
        run: python3 scripts/recheck_ea99006a.py --offline

      - name: Re-fetch every official source
        run: python3 scripts/recheck_ea99006a.py

      # The published site is rebuilt by .github/workflows/integrate-bdcaf0bf.yml from the
      # merged dataset (data/bdcaf0bf/), which reads this folder as an input. This job no
      # longer writes index.html, pages/ or assets/ itself: two generators writing the same
      # root files made the published answers alternate (flag B02).
      - name: Validate the ledger JSON this session owns
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for f in sorted(glob.glob("data/ea99006a/*.json")):
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as exc:
                  bad.append("%s: %s" % (f, exc))
          if bad:
              sys.exit("ledger JSON is not parseable:\n" + "\n".join(bad))
          print("ea99006a ledger: %d JSON files parse" % len(glob.glob("data/ea99006a/*.json")))
          PY

      - name: Commit any change to the ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/ea99006a)" ]; then
            git add data/ea99006a
            git commit -m "ea99006a: automated official-source re-check"
            git push
          else
            echo "no changes"
          fi
