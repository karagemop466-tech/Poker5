name: recheck-ea99006a

# Archived ea99006a source ledger re-check. The published root dashboard is
# rebuilt only by daily-scrape.yml from the c6087e2c capture. This workflow
# must not regenerate or commit index.html/pages/assets, because doing so would
# race the canonical publisher and alternate the live site between datasets.
# Re-fetches official URLs, hashes them, and records the changes in its ledger.

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recheck-ea99006a
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the source ledger offline
        run: python3 scripts/recheck_ea99006a.py --offline

      - name: Re-fetch every official source
        run: python3 scripts/recheck_ea99006a.py

      - name: Confirm only the archived source ledger is changed
        run: python3 scripts/recheck_ea99006a.py --offline

      - name: Commit changes to the archived source ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/ea99006a/)" ]; then
            git add data/ea99006a/
            git commit -m "ea99006a: archived source-ledger re-check"
            git push
          else
            echo "no changes"
          fi
